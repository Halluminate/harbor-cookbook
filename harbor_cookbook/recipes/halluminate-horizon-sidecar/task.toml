version = "1.0"

[verifier]
timeout_sec = 900.0
user = "root"

[agent]
timeout_sec = 1800.0
user = "model"

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 20480

[[environment.mcp_servers]]
name = "halluminate"
transport = "streamable-http"
url = "http://halluminate:8000/mcp"
